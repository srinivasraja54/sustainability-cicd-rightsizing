name: CI

# The orchestrator test suite (model and storage are faked) plus a Bicep
# build of the infra. Zero model calls, zero Azure credentials -- this must
# stay runnable on every PR from a fork.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: orchestrator/requirements.txt

      - name: Install
        run: pip install -r requirements.txt pytest

      - name: Test
        run: pytest -q

  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Bicep
        # az ships on ubuntu-latest; no login needed to compile.
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build-params --file infra/parameters/main.bicepparam --stdout > /dev/null
